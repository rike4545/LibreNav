name: Dependabot safe auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify Dependabot group and commit
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr="$(gh pr view "$PR_NUMBER" --json author,baseRefName,headRefName,headRefOid,isDraft,state)"
          author="$(jq -r '.author.login' <<< "$pr")"
          base="$(jq -r '.baseRefName' <<< "$pr")"
          head="$(jq -r '.headRefName' <<< "$pr")"
          head_sha="$(jq -r '.headRefOid' <<< "$pr")"
          is_draft="$(jq -r '.isDraft' <<< "$pr")"
          state="$(jq -r '.state' <<< "$pr")"

          # Only the two explicitly grouped npm patch/minor update branches
          # are eligible. GitHub Actions and major-version updates are excluded.
          case "$head" in
            dependabot/npm_and_yarn/production-minor-and-patch-*|dependabot/npm_and_yarn/development-minor-and-patch-*) ;;
            *) echo "PR branch is not an approved npm patch/minor group."; exit 0 ;;
          esac

          if [[ "$author" != "dependabot[bot]" || "$base" != "main" || "$state" != "OPEN" || "$is_draft" == "true" ]]; then
            echo "PR is not an eligible open Dependabot PR targeting main."
            exit 0
          fi

          # Do not act on a successful CI run for an older commit.
          if [[ "$head_sha" != "$CI_HEAD_SHA" ]]; then
            echo "The PR head changed after this CI run; waiting for fresh checks."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for all current PR checks
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.eligibility.outputs.number }}
        run: gh pr checks "$PR_NUMBER" --watch

      - name: Merge validated patch/minor update
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.eligibility.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
